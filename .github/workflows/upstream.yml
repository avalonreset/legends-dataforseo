name: upstream baseline
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python scripts/check_upstream.py > upstream.json
      - name: Report upstream changes for review
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('upstream.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Official DataForSEO tooling baseline (no dependencies changed)\n\n')
              stream.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          if report['changed']:
              raise SystemExit('Official tooling changed; review docs/UPSTREAM.md before updating the baseline.')
          PY
