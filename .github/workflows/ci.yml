name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade "pip>=26.2.2"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python examples/offline.py
      - run: python examples/offline_views.py
      - run: python -m legends_dataforseo doctor
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_public.py
      - run: python scripts/smoke_wheel.py
      - run: python scripts/release_checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
